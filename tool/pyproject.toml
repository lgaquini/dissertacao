[project]
name = "dissertacao"
version = "0.1.0"
description = "Ferramenta RAG para terapia de reminiscência com idosos"
readme = "README.md"
authors = [
    { name = "lgaquini", email = "lgaquini@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    # Interface
    "streamlit>=1.35.0",
    # STT
    "faster-whisper>=1.0.0",
    # Áudio
    "sounddevice>=0.4.6",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    # RAG / Embeddings
    "chromadb>=1.0.0",               # o chroma_db/ persistido foi gerado com 1.x
    "sentence-transformers>=3.0.0",
    # LLM
    "ollama>=0.5.0",                 # llm/chat.py usa think= e response.message.content
    # Utilitários
    "pypdf>=4.0.0",                  # rag/ingest.py lê PDFs de data/historia
    # TTS
    "edge-tts>=7.2.8",
    "piper-tts>=1.3.0",              # audio/tts.py usa synthesize() -> AudioChunk
]

[dependency-groups]
# Só para preparar o corpus (PDF -> markdown em data/livros); não é usado em runtime.
# No Raspberry Pi: uv sync --no-dev
dev = [
    "markitdown[pdf]>=0.1.7",
]

[project.scripts]
memoria = "memoria.cli:main"      # uv run memoria [--texto] [--contexto closed_book]
ingest = "rag.ingest:main"        # uv run ingest

# O pacote `memoria` é só o launcher; o resto do código fica na raiz de tool/ e é
# encontrado porque o `uv sync` instala o projeto em modo editável (aponta para tool/).
[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "memoria"
module-root = ""
